[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-analysis"
version = "0.1.0"
description = "场内金融工具 - 基金溢价率分析、美股指数行情、邮件日报"
requires-python = ">=3.10,<3.11"
dependencies = [
    "akshare>=1.18.64",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "requests>=2.34.2",
    "scipy>=1.10.0",
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
where = ["src"]
